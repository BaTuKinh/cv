<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nguyễn Thị Tường Vi – CV</title>
  <meta name="description" content="CV trực tuyến: quản lý & đảm bảo kỹ thuật khoa xét nghiệm, thống kê xử lý số liệu nghiên cứu.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar no-print">
    <nav>
      <a href="#about">Giới thiệu</a>
      <a href="#experience">Kinh nghiệm</a>
      <a href="#skills">Kỹ năng</a>
      <a href="#research">Nghiên cứu</a>
      <a href="#education">Học vấn</a>
      <button id="theme-btn" type="button" aria-label="Đổi giao diện sáng/tối">◐</button>
      <button id="print-btn" type="button">In / Lưu PDF</button>
    </nav>
  </header>

  <main>
    <section id="about" class="hero"></section>
    <section id="highlights" class="stats"></section>
    <section id="experience"><h2>Kinh nghiệm làm việc</h2><div id="exp-list" class="timeline"></div></section>
    <section id="skills"><h2>Kỹ năng chuyên môn</h2><div id="skill-list" class="cards"></div></section>
    <section id="research">
      <h2>Nghiên cứu, báo cáo &amp; poster</h2>
      <div class="filters no-print" id="filters"></div>
      <div id="res-list" class="res-list"></div>
    </section>
    <section id="education"><h2>Học vấn</h2><div id="edu-list" class="timeline"></div></section>
    <section id="certificates"><h2>Đào tạo &amp; chứng chỉ</h2><div id="cert-list" class="res-list"></div></section>
    <section id="memberships"><h2>Thành viên hiệp hội</h2><div id="member-list" class="chips"></div></section>
  </main>

  <footer>
    <span id="foot-name"></span> · Cập nhật <span id="foot-date"></span>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
